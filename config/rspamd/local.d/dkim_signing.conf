enabled = true;

selector = "mail";

path = "/var/lib/rspamd/dkim/$domain.$selector.key";

sign_authenticated = true;
sign_local = true;

use_domain = "header";
use_redis = false;

allow_hdrfrom_mismatch = false;
allow_username_mismatch = true;

# IMPORTANT: path/selector above are applied by rspamd only in fallback mode.
# With try_fallback = false no signature is added at all: the log shows
# "dkim unconfigured and fallback disabled". The key is looked up by path,
# and if there is no file for the domain, the email simply goes out unsigned.
try_fallback = true;

# use_esld defaults to true: emails from subdomains (guest.example.com)
# are signed with the example.com key. DMARC accepts this (relaxed alignment),
# and a separate DNS record for the subdomain is not needed.
