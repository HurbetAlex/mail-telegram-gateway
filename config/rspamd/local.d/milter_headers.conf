# Adds headers with check results to incoming emails.
# X-Spam-Status and Authentication-Results are read by mail_processor (src/app/mail/lmtp.py).
# Forged copies sent by the remote party are stripped earlier by Postfix (header_checks);
# the app additionally treats any "Yes" in X-Spam-Status as spam and trusts
# Authentication-Results only when the authserv-id matches AUTHSERV_ID.
use = ["x-spam-status", "x-spamd-result", "authentication-results"];
# authserv-id used in Authentication-Results; keep equal to AUTHSERV_ID in .env
hostname = "mail.example.com";
