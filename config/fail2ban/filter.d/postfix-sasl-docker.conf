# fail2ban: failed SASL authentications of postfix running in a docker container.
#
# Container logs go to journald (docker logging driver journald), and
# fail2ban with backend=systemd builds the line for the filter like this (filtersystemd.py,
# formatJournalEntry): "<_HOSTNAME> <SYSLOG_IDENTIFIER>[<_PID>]: <MESSAGE>",
# where SYSLOG_IDENTIFIER = the tag (postfix), and MESSAGE is the whole stdout line of
# postfix with its own syslog prefix:
#   host postfix[1234]: Oct 14 04:26:43 mail postfix/smtps/smtpd[100117]: warning: unknown[203.0.113.109]: SASL LOGIN authentication failed: generic failure, sasl_username=info@example.com
# (the journal date is passed separately; when checking a file with fail2ban-regex the date is
# cut from the line, so the date and host name in the prefix are optional).
# The format is taken from the fail2ban 1.0.2 sources.
#
# Spoofing protection: the IP is taken only from the strict start of the line. The prefix
# (journald part, date and postfix/<service>[pid] process name) is fixed,
# and failregex is anchored right after it. No ".*" at the start: otherwise an attacker
# could inject into the tail of the line (sasl_username=, from=<...> etc.) the text
# "warning: x[8.8.8.8]: SASL LOGIN authentication failed" and get a foreign IP banned.

[Definition]
prefregex = ^\s*(?:\S+ postfix\[\d+\]:\s+)?(?:\w{3} [ \d]\d \d\d:\d\d:\d\d\s+)?(?:\S+\s+)?postfix/[\w/-]+\[\d+\]: <F-CONTENT>.+</F-CONTENT>$

failregex = ^warning: [^\[\]\s]*\[<HOST>\]: SASL [A-Z0-9_-]+ authentication failed

ignoreregex =

# The postfix container (container_name in docker-compose.yml). The CONTAINER_NAME field
# is set by the docker journald driver itself and does not depend on the tag.
journalmatch = CONTAINER_NAME=postfix
